<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgK2Chh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shK2Chh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="360" fill="url(#bgK2Chh)" rx="16"/>
  <rect x="1" y="1" width="798" height="358" fill="none" stroke="#86efac" stroke-width="1.5" rx="15"/>
  <rect x="20" y="14" width="760" height="36" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="400" y="38" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#15803d">
    TRÒ CHƠI BỔ TRỢ: "TÌM NGƯỜI CHỈ HUY" &amp; PHẢN XẠ VÒNG TRÒN (SGK GDTC LỚP 2)
  </text>

  <rect x="40" y="64" width="720" height="270" rx="14" fill="#fff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shK2Chh)"/>
  <!-- Circle formation -->
  <circle cx="340" cy="195" r="95" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- 8 kids around circle -->
  <circle cx="340" cy="100" r="12" fill="#0284c7"/><text x="340" y="104" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">CH</text>
  <circle cx="407" cy="128" r="11" fill="#38bdf8"/>
  <circle cx="435" cy="195" r="11" fill="#38bdf8"/>
  <circle cx="407" cy="262" r="11" fill="#38bdf8"/>
  <circle cx="340" cy="290" r="11" fill="#38bdf8"/>
  <circle cx="273" cy="262" r="11" fill="#38bdf8"/>
  <circle cx="245" cy="195" r="11" fill="#38bdf8"/>
  <circle cx="273" cy="128" r="11" fill="#38bdf8"/>

  <!-- Guesser in center -->
  <circle cx="340" cy="195" r="16" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="340" y="199" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Đoán</text>

  <!-- Teacher & Legend box -->
  <rect x="485" y="100" width="245" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="607" y="128" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="13" font-weight="bold" fill="#0f172a">Luật chơi &amp; Quan sát</text>
  <text x="502" y="155" font-family="'Segoe UI', Arial" font-size="11.5" fill="#334155">• Cả lớp đứng vòng tròn làm theo</text>
  <text x="510" y="173" font-family="'Segoe UI', Arial" font-size="11.5" fill="#334155">động tác của "Người chỉ huy" (CH).</text>
  <text x="502" y="198" font-family="'Segoe UI', Arial" font-size="11.5" fill="#334155">• Bạn đứng giữa quan sát tinh mắt</text>
  <text x="510" y="216" font-family="'Segoe UI', Arial" font-size="11.5" fill="#334155">để đoán đúng bạn chỉ huy trong 3 lần.</text>
  <text x="502" y="242" font-family="'Segoe UI', Arial" font-size="11.5" fill="#15803d" font-weight="600">✓ Rèn phản xạ, sự tập trung và gắn kết</text>
  <text x="502" y="268" font-family="'Segoe UI', Arial" font-size="11.5" fill="#0284c7" font-weight="600">✓ Vận động tay chân nhẹ nhàng đầu giờ</text>
</svg>
