  </text>

  <rect x="40" y="64" width="720" height="270" rx="14" fill="#fff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#shK4Cv)"/>
  <line x1="185" y1="88" x2="185" y2="296" stroke="#ef4444" stroke-width="3"/>
  <text x="185" y="80" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="11" font-weight="bold" fill="#dc2626">VẠCH XUẤT PHÁT</text>

