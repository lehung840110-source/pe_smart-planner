<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgK4Cv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
    <filter id="shK4Cv" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="360" fill="url(#bgK4Cv)" rx="16"/>
  <rect x="1" y="1" width="798" height="358" fill="none" stroke="#e9d5ff" stroke-width="1.5" rx="15"/>
  <rect x="20" y="14" width="760" height="36" rx="8" fill="#f3e8ff" stroke="#c084fc" stroke-width="1"/>
