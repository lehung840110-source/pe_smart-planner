<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgK2Dn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shK2Dn" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="360" fill="url(#bgK2Dn)" rx="16"/>
  <rect x="1" y="1" width="798" height="358" fill="none" stroke="#fdba74" stroke-width="1.5" rx="15"/>
  <rect x="20" y="14" width="760" height="36" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="1"/>
  <text x="400" y="38" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#c2410c">
    TRÒ CHƠI VẬN ĐỘNG: "ĐUA NGỰA" / TIẾP SỨC CHẠY NHANH (SGK GDTC LỚP 2)
  </text>

  <!-- Field view -->
  <rect x="40" y="64" width="720" height="270" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" filter="url(#shK2Dn)"/>
  <!-- Start and Turn lines -->
  <line x1="180" y1="90" x2="180" y2="300" stroke="#ef4444" stroke-width="3"/>
  <text x="180" y="82" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="11" font-weight="bold" fill="#dc2626">VẠCH XUẤT PHÁT</text>

  <!-- Lane 1 -->
  <line x1="180" y1="150" x2="660" y2="150" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="670" cy="150" r="14" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <polygon points="670,118 686,125 670,132" fill="#ef4444"/>
  <line x1="670" y1="118" x2="670" y2="150" stroke="#7c2d12" stroke-width="2.5"/>
  <!-- Running stick horse player -->
  <g transform="translate(380, 138)">
    <circle cx="0" cy="-22" r="9" fill="#fed7aa" stroke="#334155" stroke-width="1.5"/>
    <rect x="-7" y="-12" width="14" height="20" rx="3" fill="#0284c7"/>
    <line x1="-22" y1="4" x2="28" y2="-4" stroke="#92400e" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="28" cy="-6" r="5" fill="#d97706"/>
    <line x1="-4" y1="8" x2="-12" y2="26" stroke="#1e3a8a" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="4" y1="8" x2="14" y2="24" stroke="#1e3a8a" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <path d="M430 140 L635 140 Q655 140 655 155 Q655 170 635 170 L205 170" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- Lane 2 -->
  <line x1="180" y1="245" x2="660" y2="245" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="670" cy="245" r="14" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
  <polygon points="670,213 686,220 670,227" fill="#0284c7"/>
  <line x1="670" y1="213" x2="670" y2="245" stroke="#0369a1" stroke-width="2.5"/>

  <!-- Waiting teams -->
  <circle cx="145" cy="150" r="10" fill="#f97316"/><circle cx="115" cy="150" r="10" fill="#fb923c"/><circle cx="85" cy="150" r="10" fill="#fdba74"/>
  <text x="115" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#c2410c">ĐỘI 1</text>
  <circle cx="145" cy="245" r="10" fill="#0284c7"/><circle cx="115" cy="245" r="10" fill="#38bdf8"/><circle cx="85" cy="245" r="10" fill="#7dd3fc"/>
  <text x="115" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">ĐỘI 2</text>

  <text x="420" y="316" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="12" font-weight="600" fill="#9a3412">
    Cách chơi: Chạy nhanh vòng qua cờ đích, trao gậy/ngựa tiếp sức cho bạn tiếp theo (An toàn, không chen lấn)
  </text>
</svg>
